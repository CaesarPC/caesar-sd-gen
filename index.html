<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caesar本地SD生图</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f8f5f0; color: #333; padding: 20px; max-width: 1000px; margin: 0 auto; }
        .status-bar { background: #fff; padding: 12px 20px; border-radius: 10px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 8px; }
        .status-ok { background: #4CAF50; }
        .status-error { background: #f44336; }
        h1 { color: #5d4037; text-align: center; margin: 20px 0; font-weight: 600; }
        .input-box { width: 100%; padding: 15px; font-size: 16px; border: 1px solid #e0d8cc; border-radius: 10px; margin: 10px 0; background: #fff; color: #333; }
        .upload-area { background: #fff; padding: 15px; border-radius: 10px; margin: 10px 0; border: 1px dashed #d0c8bc; }
        .upload-area label { color: #666; font-size: 14px; }
        .ref-preview { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
        .ref-preview img { width: 80px; height: 80px; object-fit: cover; border-radius: 8px; }
        .btn { width: 100%; padding: 16px; font-size: 18px; background: #8d6e63; color: white; border: none; border-radius: 10px; cursor: pointer; margin: 15px 0; transition: background 0.2s; }
        .btn:hover { background: #6d4c41; }
        .result { margin-top: 20px; text-align: center; background: #fff; padding: 20px; border-radius: 10px; }
        .result img { max-width: 100%; border-radius: 10px; margin-top: 15px; }
        .loading { color: #8d6e63; font-size: 16px; }
    </style>
</head>
<body>
    <div class="status-bar">
        <div><span class="status-dot status-error" id="statusDot"></span><span id="statusText">正在检测服务状态...</span></div>
        <div style="color:#999;font-size:14px">Caesar 4090 本地生图</div>
    </div>
    <h1>🎨 AI 生图工作台</h1>
    <input type="text" class="input-box" id="prompt" placeholder="输入提示词，比如:ww2 german soldier, realistic, 4k">
    <div class="upload-area">
        <label>上传参考图（最多3张，作为风格/内容参考）：</label>
        <input type="file" id="refs" accept="image/*" multiple>
        <div class="ref-preview" id="refPreview"></div>
    </div>
    <button class="btn" onclick="gen()">🚀 开始生成</button>
    <div class="result" id="result"></div>

    <script>
        const API_BASE = 'https://sweet-carrots-peel.loca.lt';
        const refsInput = document.getElementById('refs');
        const refPreview = document.getElementById('refPreview');

        refsInput.addEventListener('change', (e) => {
            refPreview.innerHTML = '';
            const files = Array.from(e.target.files).slice(0,3);
            files.forEach(file => {
                const img = document.createElement('img');
                img.src = URL.createObjectURL(file);
                refPreview.appendChild(img);
            });
        });

        async function checkStatus() {
            try {
                await fetch(API_BASE, { method: 'GET' });
                document.getElementById('statusDot').className = 'status-dot status-ok';
                document.getElementById('statusText').innerText = '生图服务正常运行';
            } catch (e) {
                document.getElementById('statusDot').className = 'status-dot status-error';
                document.getElementById('statusText').innerText = '生图服务未连接';
            }
        }
        checkStatus();

        async function gen() {
            const prompt = document.getElementById('prompt').value;
            if (!prompt) return alert('请输入提示词');
            document.getElementById('result').innerHTML = '<p class="loading">⏳ 正在生成，4090渲染中...约10秒出图</p>';
            const formData = new FormData();
            formData.append('prompt', prompt);
            const files = Array.from(refsInput.files).slice(0,3);
            files.forEach((f,i) => formData.append(`ref_${i}`, f));
            try {
                const res = await fetch(`${API_BASE}/api/gen`, { method: 'POST', body: formData });
                const blob = await res.blob();
                const imgUrl = URL.createObjectURL(blob);
                document.getElementById('result').innerHTML = `<p>✅ 生成完成：</p><img src="${imgUrl}">`;
            } catch (e) {
                document.getElementById('result').innerHTML = '<p style="color:red">❌ 生图失败，请稍后重试</p>';
            }
        }
    </script>
</body>
</html>
