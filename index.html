<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caesar本地SD生图</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #121212; color: white; padding: 20px; max-width: 1000px; margin: 0 auto; }
        h1 { text-align: center; margin: 20px 0; color: #4CAF50; }
        .input-box { width: 100%; padding: 15px; font-size: 16px; border: none; border-radius: 8px; margin: 10px 0; background: #1e1e1e; color: white; }
        .btn { width: 100%; padding: 15px; font-size: 18px; background: #4CAF50; color: white; border: none; border-radius: 8px; cursor: pointer; margin: 10px 0; }
        .result { margin-top: 20px; text-align: center; }
        .result img { max-width: 100%; border-radius: 8px; }
        .upload { margin: 10px 0; color: #aaa; }
    </style>
</head>
<body>
    <h1>⚡ Caesar 4090 本地生图</h1>
    <input type="text" class="input-box" id="prompt" placeholder="输入提示词，比如:ww2 german soldier, realistic, 4k">
    <div class="upload">
        <label>上传参考图（可选）：</label>
        <input type="file" id="ref" accept="image/*">
    </div>
    <button class="btn" onclick="gen()">生成图片</button>
    <div class="result" id="result"></div>
    <script>
        async function gen() {
            const prompt = document.getElementById('prompt').value;
            if (!prompt) return alert('请输入提示词');
            document.getElementById('result').innerHTML = '<p>正在生成，4090渲染中...约10秒</p>';
            const formData = new FormData();
            formData.append('prompt', prompt);
            const refFile = document.getElementById('ref').files[0];
            if (refFile) formData.append('ref_img', refFile);
            try {
                const res = await fetch('http://localhost:7888/gen', { method: 'POST', body: formData });
                const html = await res.text();
                document.open();
                document.write(html);
                document.close();
            } catch (e) {
                document.getElementById('result').innerHTML = '<p style="color:red">连接本地生图服务失败，请确认电脑上服务已启动</p>';
            }
        }
    </script>
</body>
</html>
