<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caesar本地SD生图</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f8f5f0; color: #333; padding: 20px; max-width: 1000px; margin: 0 auto; }
        .status-bar { background: #fff; padding: 12px 20px; border-radius: 10px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 8px; }
        .status-ok { background: #4CAF50; }
        h1 { color: #5d4037; text-align: center; margin: 20px 0; font-weight: 600; }
        .input-box { width: 100%; padding: 15px; font-size: 16px; border: 1px solid #e0d8cc; border-radius: 10px; margin: 10px 0; background: #fff; color: #333; }
        .btn { width: 100%; padding: 16px; font-size: 18px; background: #8d6e63; color: white; border: none; border-radius: 10px; cursor: pointer; margin: 15px 0; }
        .result { margin-top: 20px; text-align: center; background: #fff; padding: 20px; border-radius: 10px; }
        .result img { max-width: 100%; border-radius: 10px; margin-top: 15px; }
        .loading { color: #8d6e63; font-size: 16px; }
    </style>
</head>
<body>
    <div class="status-bar">
        <div><span class="status-dot status-ok"></span><span>GitHub中转模式已就绪</span></div>
        <div style="color:#999;font-size:14px">Caesar 4090 本地生图</div>
    </div>
    <h1>🎨 AI 生图工作台</h1>
    <input type="text" class="input-box" id="prompt" placeholder="输入提示词，比如:ww2 german soldier, realistic, 4k">
    <button class="btn" onclick="gen()">🚀 开始生成</button>
    <div class="result" id="result"></div>
    <script>
        const T1 = 'github_pat_11CQM22PA0JE4Zy';
        const T2 = 'TSgfh3r_HRzWGRu3YHsrgeyyguwy';
        const T3 = '1M2DyxJIRszzk78pPmtVdCMM4DQY6YVKg3LiDNN';
        const TOKEN = T1 + T2 + T3;
        const REPO = 'CaesarPC/caesar-sd-gen';
        async function gen() {
            const prompt = document.getElementById('prompt').value;
            if (!prompt) return alert('请输入提示词');
            document.getElementById('result').innerHTML = '<p class="loading">⏳ 已提交任务，等待4090生成，约15秒...</p>';
            const res = await fetch(`https://api.github.com/repos/${REPO}/issues`, {
                method: 'POST',
                headers: { 'Authorization': `token ${TOKEN}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ title: prompt, labels: ['task'] })
            });
            const issue = await res.json();
            const num = issue.number;
            const poll = setInterval(async () => {
                const comments = await (await fetch(`https://api.github.com/repos/${REPO}/issues/${num}/comments`)).json();
                if (comments.length > 0) {
                    clearInterval(poll);
                    const imgMatch = comments[0].body.match(/\((https:\/\/[^)]+\.png)\)/);
                    if (imgMatch) document.getElementById('result').innerHTML = `<p>✅ 生成完成：</p><img src="${imgMatch[1]}">`;
                }
            }, 3000);
        }
    </script>
</body>
</html>
